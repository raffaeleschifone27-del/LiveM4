name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Trova il progetto
        id: proj
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Compila
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LivePhotoM4-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
